name: Cosmo Tech Babylon API - test, build, push
run-name: "[cosmotech-babylon-api] ${{ github.event_name }} ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main, 'feature/*', 'release/*']
  push:
    branches: [main]
    tags: ["*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY_URL }}
  REPOSITORY: ${{ vars.BABYLON_API_REGISTRY_REPO }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lint
        run: | 
          uvx ruff check --output-format=github
          uvx ruff format --check
      - name: Unit tests
        run: uv run --locked --group dev --extra api pytest tests/unit -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/babylon-api --set image.repository=example
      - run: helm template ci deploy/helm/babylon-api --set image.repository=example > /dev/null

  image:
    needs: [tests, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_ACCOUNT_NAME }}
          password: ${{ secrets.HARBOR_ROBOT_ACCOUNT_SECRET }}

      # Build the docker image
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: babylon-api:test
          build-args: BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test the docker image
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 babylon-api:test

          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/about; then
              exit 0
            fi
            sleep 1
          done

          docker logs api
          exit 1

      # Push the docker image only for release tags
      - name: Push to Harbor
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          IMAGE="${REGISTRY}/${REPOSITORY}"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            docker tag babylon-api:test "$IMAGE:latest"
            docker push "$IMAGE:latest"
          else
            VERSION="${GITHUB_REF_NAME}"
            docker tag babylon-api:test "$IMAGE:$VERSION"
            docker tag babylon-api:test "$IMAGE:latest"

            docker push "$IMAGE:$VERSION"
            docker push "$IMAGE:latest"
          fi

      # Run Trivy and generate SBOM in CycloneDX format
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        with:
          scan-type: image
          image-ref: babylon-api:test
          format: cyclonedx
          output: sbom.json

      # Upload SBOM to the main parent project
      - name: Upload SBOM - Main
        uses: DependencyTrack/gh-upload-sbom@v4
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        with:
          server-hostname: ${{ secrets.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          api-key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project: f3cfc3ed-4f7e-43dc-9693-550363eedbc1
          bom-filename: sbom.json

      # Upload SBOM to a release-specific child project
      - name: Upload SBOM - Release
        uses: DependencyTrack/gh-upload-sbom@v4
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        with:
          server-hostname: ${{ secrets.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          api-key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}

          project-name: babylon-api
          project-version: ${{ github.ref_name }}

          auto-create: true
          parent: f3cfc3ed-4f7e-43dc-9693-550363eedbc1

          is-latest: true
          bom-filename: sbom.json