# =========================================================
# SHARED CORE VARIABLES
# Contains global configuration values common to all workspaces.
# Updates to this file are automatically propagated to all
# workspace deployments that inherit these settings.
# =========================================================

# Organization
organization_name: Babylon v6 Organization
organization_id: o-xxxxxxxxxxxx

# Solution
solution_name: Babylon v6 Solution
solution_id: sol-xxxxxxxxxx
simulator_repository: tenant-sphinx/brewerysamplesolution_simulator
solution_description: Brewery Testing babylon v6 Solution PLT
solution_key: breweryTesting
simulator_version: 3.1.1

# Webapp
# These variables are used to render your Webapp.yaml manifest and can be mapped to the
# terraform module variables (terraform.tfvars) used by the terraform-webapp module.
# See the module's example tfvars for reference:
# https://github.com/Cosmo-Tech/terraform-webapp/blob/main/terraform.tfvars

## VARIABLES FOR KOB (= On-Premise)
cloud_provider: kob
cluster_name: kubernetes
domain_zone: onpremise.platform.cosmotech.com
tenant: sphinx
webapp_name: business
azure_entra_tenant_id: e413b834-8be8-4822-a370-be619545cb49
state_host: https://cosmotechstates.onpremise.platform.cosmotech.com

# Webapp module version pinned to a specific release of terraform-webapp.
# Override with --tf-webapp-version on 'babylon macro init', or edit this value directly.
# See available versions: https://github.com/Cosmo-Tech/terraform-webapp/releases
tf_webapp_version: 1.1.0

# Remote state
remote: true

# ACL — applied to Organization and Solution
security:
  default: none
  accessControlList:
    - id: tenant-admin
      role: admin
    - id: tenant-editor
      role: editor
    - id: tenant-viewer
      role: viewer
