apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-scripts-${job_name}
  namespace: ${namespace}
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: postgresql-scripts
          image: postgres:17-trixie
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              SCRIPT_COUNT=0
              for f in $$(find /scripts -maxdepth 1 -name '*.sql' -print | sort); do
                SCRIPT_COUNT=$$((SCRIPT_COUNT + 1))
                echo "INFO:  Running script $$(basename "$$f")"
                psql -h ${db_host} -p ${db_port} -U ${cosmotech_api_writer_username} -d ${cosmotech_api_database} \
                  -v ON_ERROR_STOP=1 -f "$$f"
              done
              if [ "$$SCRIPT_COUNT" -eq 0 ]; then
                echo "INFO:  No SQL scripts found nothing to run"
              else
                echo "SUCCESS:  $$SCRIPT_COUNT script(s) executed successfully"
              fi
          env:
            - name: PGOPTIONS
              value: "-c search_path=${workspace_schema},public"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-cosmotechapi
                  key: writer-password
          volumeMounts:
            - name: sql-scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: sql-scripts
          configMap:
            name: ${configmap_name}
      restartPolicy: Never
