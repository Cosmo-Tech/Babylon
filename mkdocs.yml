site_name: babylon
site_url: https://cosmo-tech.github.io/Babylon/latest/
site_description: User guides and CLI reference for Cosmo Tech Babylon
strict: true
repo_url: https://github.com/Cosmo-Tech/Babylon
repo_name: Cosmo-Tech/Babylon
exclude_docs: |
  partials/

theme:
  name: material
  font:
    code: Fira Mono
  logo: assets/img/logo.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.footer
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
extra:
  version:
    provider: mike
nav:
  - Home: 'index.md'
  - Getting started:
    - Installation: 'getting_started/installation.md'
    - Configuration: 'getting_started/configuration.md'
  - Tutorials:
      - Overview: 'tutorial/index.md'
      - Deploy a workspace: 'tutorial/deploy.md'
      - Use existing resources: 'tutorial/existing_resources.md'
      - Destroy a workspace: 'tutorial/destroy.md'
  - Examples:
      - Overview: 'examples/index.md'
      - Deploy a project: 'examples/deploy.md'
      - Update access controls: 'examples/update.md'
      - Superset dashboards: 'examples/superset.md'
      - Power BI dashboards: 'examples/powerbi.md'
      - Delivery Brewery: 'examples/delivery_brewery.md'
  - Guides:
      - Deployment state: 'guides/state.md'
      - PostgreSQL sidecars: 'guides/postgres.md'
      - Azure requirements: 'guides/azure.md'
  - Concepts:
      - Contribute: 'concepts/contribute.md'
      - Environments: 'concepts/environment.md'
      - Documentation maintenance: 'concepts/documentation.md'
  - References:
      - babylon: 'references/cli.md'
      - functions:
          - Decorators: 'references/decorators.md'

validation:
  links:
    anchors: warn

markdown_extensions:
  - mkdocs-click
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - def_list
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      title: "In this page"
      permalink: true
plugins:
    - search
    - mkdocstrings
    - gen-files:
        scripts:
          - scripts/generate_index.py
    - mike