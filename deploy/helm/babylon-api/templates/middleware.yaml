{{- /*
Traefik receives /<ns>/babylon-api/apply and forwards /apply to the pod: the API routes
stay at the root (/healthz, /apply...) and do not depend on where they are published.
*/ -}}
{{- if .Values.ingress.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "babylon-api.middlewareName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "babylon-api.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ include "babylon-api.ingressPath" . | quote }}
    forceSlash: true
{{- end }}
