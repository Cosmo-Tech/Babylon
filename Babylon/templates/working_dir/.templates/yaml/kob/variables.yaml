# =========================================================
# IMPORTANT: You can add variables here as needed!
# Make sure they are used in the manifest YAML.
# =========================================================
# Organization
organization_name: Babylon v5 Organization
# Solution
solution_name: Babylon v5 Solution
simulator_repository: tenant-sphinx/brewerysamplesolution_simulator
solution_description: Brewery Testing babylon v5 Solution PLT
solution_key: breweryTesting
simulator_version: 3.1.1
# Workspace
workspace_name: Babylon v5 workspace
workspace_key: brewerytestingwork
workspace_description: Testing workspace for the brewery web application
# Webapp
# These variables are used to render your Webapp.yaml manifest and can be mapped to the
# terraform module variables (terraform.tfvars) used by the terraform-webapp module.
# See the module's example tfvars for reference:
# https://github.com/Cosmo-Tech/terraform-webapp/blob/main/terraform.tfvars

# ProjectBuild
# CoSML project location supported formats:
# - Local folder: file:///home/me/cosml_project
# - Local folder archive: file:///home/me/cosmo_project.tar.gz
# - Git repository and reference:
#   - SSH access: git@github.com:my_name/my_solution.git@branch_or_tag
#   - HTTPS access: git+https://vcs.server/my_solution.git@branch_or_tag
build_project_archive_url: git+https://github.com/Cosmo-Tech/brewery_sample_solution.git@main

## VARIABLES EXAMPLE FOR KOB (= On-Premise)
cloud_provider: kob
cluster_name: kubernetes
domain_zone: onpremise.platform.cosmotech.com
tenant: sphinx
webapp_name: business
organization_id: o-xxxxxxxxxxxx
azure_entra_tenant_id: e413b834-8be8-4822-a370-be619545cb49
state_host: https://cosmotechstates.onpremise.platform.cosmotech.com

# Webapp module version pinned to a specific release of terraform-webapp.
# Override with --tf-webapp-version on 'babylon init', or edit this value directly.
# See available versions: https://github.com/Cosmo-Tech/terraform-webapp/releases
tf_webapp_version: 1.1.0

# Remote state
remote: true

# documentation url
documentation_url: 'https://portal.cosmotech.com/resources/platform-resources/web-app-user-guide'

# ACL
security:
  default: none
  accessControlList:
    - id: tenant-admin
      role: admin
    - id: tenant-editor
      role: editor
    - id: tenant-viewer
      role: viewer