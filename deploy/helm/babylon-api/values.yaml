# Image used by the API Deployment AND by the worker Jobs (same image, different command).
image:
  repository: ""
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  # Existing docker-registry Secret used to pull from Harbor.
  pullSecret: ""

replicaCount: 1

# Comma-separated list of git hosts the API accepts in `repository.url`.
allowedGitHosts: github.com

worker:
  serviceAccountName: babylon-worker
  # Name of an existing Secret injected in the worker Jobs with `envFrom`
  # (e.g. BABYLON_API_GIT_TOKEN, Keycloak client secret...). Empty = none.
  secretName: ""

api:
  serviceAccountName: babylon-api

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # traefik.ingress.kubernetes.io/router.tls: "true"
  host: ""
  # Path under the release namespace: the API is published at /<namespace><path>
  # (e.g. /default/babylon-api). Traefik strips this prefix before forwarding to the API.
  path: /babylon-api
  pathType: Prefix
  # Name of the TLS Secret (created by cert-manager or by hand e.g letsencrypt-prod). Empty = no TLS.
  tlsSecretName: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
