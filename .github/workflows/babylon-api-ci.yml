name: Cosmo Tech Babylon API - test, build, packages
run-name: "[cosmotech-babylon-api] ${{ github.event_name }} ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main, "feature/**"]
  push:
    branches: [main]
    tags: ["*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY_URL }}
  REPOSITORY: ${{ vars.BABYLON_API_REGISTRY_REPO }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lint
        run: | 
          uvx ruff check --output-format=github
          uvx ruff format --check
      - name: Unit tests
        run: uv run --locked --group dev --extra api pytest tests/unit -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/babylon-api --set image.repository=example
      - run: helm template ci deploy/helm/babylon-api --set image.repository=example > /dev/null

  image:
    needs: [tests, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_ACCOUNT_NAME }}
          password: ${{ secrets.HARBOR_ROBOT_ACCOUNT_SECRET }}

      # Build the docker image
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: babylon-api:test
          build-args: BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test the docker image
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 babylon-api:test

          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/about; then
              exit 0
            fi
            sleep 1
          done

          docker logs api
          exit 1

      # Push the docker image only for release tags
      - name: Push to Harbor
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="${REGISTRY}/${REPOSITORY}"

          docker tag babylon-api:test "$IMAGE:$VERSION"
          docker tag babylon-api:test "$IMAGE:latest"

          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
