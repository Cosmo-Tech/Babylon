# -- Image used by the API Deployment AND by the worker Jobs (same image, different command).
image:
  repository: ""
  # -- defaults to .Chart.AppVersion
  tag: ""
  pullPolicy: IfNotPresent
  # -- Existing docker-registry Secret used to pull from Harbor.
  pullSecret: ""

# -- Number of replicas for the BabylonAPI Deployment
replicaCount: 1

# -- Node selector values
nodeSelector: {}

# -- Tolerations for the API pod AND the worker Jobs. Empty = none.
tolerations: []

# -- Comma-separated list of git hosts the API accepts in `repository.url`.
allowedGitHosts: github.com

worker:
  serviceAccountName: babylon-worker
  # -- Name of an existing Secret injected in the worker Jobs
  # -- (e.g. BABYLON_API_GIT_TOKEN, ...). Empty = none.
  secretName: ""

# -- ServiceAccount name used by the Babylon API Deployment
api:
  serviceAccountName: babylon-api

# -- Service values
service:
  type: ClusterIP
  port: 80

# -- Resources values
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# -- Security context injected at pods level
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Security context injected at container level
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
